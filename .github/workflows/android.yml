name: Android prototype checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.1.13356709' 'cmake;3.22.1'
      - run: ./tools/prepare-native.sh
      - run: ./tools/test-native.sh
      - run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - run: python3 tools/check-apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-llm-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            domain/build/test-results/test/
            app/build/reports/lint-results-debug.html
