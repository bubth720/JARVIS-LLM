name: Android prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_model_probe:
        description: 'Explicitly permit the historical public-model cloud probe'
        type: boolean
        default: false
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify unchanged safety policies, catalogue and baseline tests
        run: |
          python3 tools/check-preservation-003e.py
          python3 tools/check-preservation-003f.py
          python3 tools/check-recovery-contract.py
          python3 tools/check-preservation-d4e.py
          python3 tools/check-preservation-f3a.py --successor-f3b
          python3 docs/mission-003f-f3b/verify.py
          python3 tools/recovery-vectors.py
          python3 docs/mission-003f-correction/reference/verify_vectors.py
      - name: Test offline APK hash verifier (not Android hardware)
        run: node tools/test-apk-verifier.cjs
      - name: Install verified JDK, SDK, NDK and native sources
        run: ./tools/setup-cloud.sh
      - name: Native cancellation and model admission tests
        run: ./tools/cloud-env.sh ./tools/test-native.sh
      - name: JVM and simulated Android tests, Lint, ARM64 APK
        run: ./tools/cloud-env.sh ./gradlew -I docs/mission-003f-f3b/candidate.init.gradle :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :p2-endpoint:testDebugUnitTest :p2-endpoint:assembleDebug :p2-endpoint:lintDebug :p2-client:assembleDebug :p2-client:lint --no-daemon
      - name: Check APK permissions, signature and 16 KiB compatibility
        run: ./tools/cloud-env.sh python3 tools/check-apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Check isolated fixture APKs, signatures, shared engine and contract digest
        run: ./tools/cloud-env.sh python3 tools/check-fixtures.py
      - name: Publish fixture test and failure evidence
        run: |
          python3 tools/publish-validation-003f.py
          python3 tools/publish-validation-f3a.py
          python3 docs/mission-003f-f3b/verify.py --results
      - name: Publish cloud validation with hardware limitations
        run: python3 tools/publish-validation-003b.py --mission 003D
      - name: Publish actual catalogue scale evidence
        run: python3 tools/publish-catalogue-evidence.py
      - name: Record verified build identity (no installation)
        run: ./tools/cloud-env.sh python3 tools/apk-identity-003c.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload validation reports even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jarvis-llm-validation
          path: |
            domain/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            build/native-tests/Testing/Temporary/LastTest.log
            app/build/reports/catalogue-scale.json
            build/mission003d-validation.json
            build/mission003e-preservation.json
            build/mission003e-apks.json
            build/mission003e-validation.json
            build/mission003f-*.json
            fixtures/p2-endpoint/build/test-results/testDebugUnitTest/
            fixtures/p2-endpoint/build/reports/lint-results-debug.*
            fixtures/p2-client/build/reports/lint-results-*.xml
            build/mission003c-apk-identity.json

          if-no-files-found: warn

      - name: Upload candidate contract for review only (CORE consumption blocked)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jarvis-llm-003f-contract-candidate
          path: |
            fixtures/p2-contract/CONTRACT.txt
            fixtures/p2-contract/CONTRACT.sha256
            fixtures/p2-contract/TABLES.json
            fixtures/p2-contract/src/main/aidl/
            docs/mission-003f/
            docs/mission-003f-correction/
            docs/mission-003f-f3a/
            docs/mission-003f-f3b/
          if-no-files-found: error

  model-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      memory: ${{ steps.memory.outputs.metrics }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install verified toolchain
        run: ./tools/setup-cloud.sh
      - name: Native tests and pinned sources
        run: ./tools/cloud-env.sh ./tools/test-native.sh
      - name: Build bounded cloud model probe
        run: cmake --build build/native-tests --target model_memory_probe -j2
      - name: Short real-GGUF cloud comparison (not Android PSS)
        id: memory
        run: ./tools/cloud-env.sh python3 tools/compare-model-memory.py
      - name: Upload cloud memory evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jarvis-llm-model-memory
          path: |
            build/model-memory/*.json
            build/model-memory/*.md
          if-no-files-found: warn
          retention-days: 30

  memory-result:
    needs: model-probe
    name: Cloud Linux peak RSS ${{ needs.model-probe.outputs.memory }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Cloud Linux measurements only. Android PSS and tablet admission remain unqualified.'
