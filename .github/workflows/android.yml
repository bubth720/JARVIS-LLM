name: Android prototype checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install verified JDK, SDK, NDK and native sources
        run: ./tools/setup-cloud.sh
      - name: Native cancellation and model admission tests
        run: ./tools/cloud-env.sh ./tools/test-native.sh
      - name: JVM and simulated Android tests, Lint, ARM64 APK
        run: ./tools/cloud-env.sh ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Check APK permissions, signature and 16 KiB compatibility
        run: ./tools/cloud-env.sh python3 tools/check-apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare downloadable diagnostic package
        run: ./tools/package-debug.sh
      - name: Upload APK, SHA-256 and first diagnostic instructions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jarvis-llm-debug
          path: build/diagnostic-package/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jarvis-llm-validation
          path: |
            domain/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            build/native-tests/Testing/Temporary/LastTest.log
          if-no-files-found: warn
