name: PERF-02 instrumentation and frozen runtime qualification
on:
  push:
    branches: ['codex/llm-perf-ttft-3s']
  pull_request:
    branches: ['mission/llm-perf-ttft-3s-20261104']
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PERF02_EVENT: ${{ github.event_name }}
  PERF02_BASE: ${{ github.base_ref }}
  PERF02_HEAD_REF: ${{ github.head_ref }}
  PERF02_REF: ${{ github.ref_name }}
  PERF02_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
  PERF02_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: perf02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact additive scope and historical guards at their exact SHAs
        run: |
          python3 perf02/check.py --ci --historical
          python3 -m unittest discover -s perf02 -p 'test_*.py' -v
          python3 -m unittest discover -s tests/m50 -v
          python3 -m unittest discover -s tests/prefusion -v
          python3 -m unittest discover -s tools/tests/fusion02 -v
          python3 tools/check-recovery-contract.py
          python3 tools/recovery-vectors.py
          python3 docs/mission-003f-correction/reference/verify_vectors.py
          node tools/test-apk-verifier.cjs
          python3 tools/review-fusion-02-native.py
      - name: Verified toolchain and pinned library sources — no model
        run: bash tools/setup-cloud.sh
      - name: Historical host-native safety tests — no GGUF generation
        run: bash tools/cloud-env.sh bash tools/test-native.sh
      - name: Fresh baseline at immutable PERF-02 reference, same runner
        run: |
          set -euo pipefail
          git diff --exit-code
          git checkout --detach 1b62a5c50eb979d82ef8eb0b488ab38c6fe462ce
          python3 tools/fusion02_evidence.py start --marker build/perf02/baseline-marker.json
          bash tools/cloud-env.sh ./gradlew -I docs/mission-003f-f3b/candidate.init.gradle :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :p2-endpoint:testDebugUnitTest :p2-endpoint:assembleDebug :p2-endpoint:lintDebug :p2-client:assembleDebug :p2-client:lint --rerun-tasks --no-daemon --max-workers=2 --console=plain
          python3 tools/fusion02_evidence.py finish --marker build/perf02/baseline-marker.json --output build/perf02/baseline-results.json
          mkdir -p build/perf02/baseline-xml
          cp -R domain/build/test-results/test build/perf02/baseline-xml/domain
          cp -R app/build/test-results/testDebugUnitTest build/perf02/baseline-xml/app
          cp -R fixtures/p2-endpoint/build/test-results/testDebugUnitTest build/perf02/baseline-xml/endpoint
          git diff --exit-code
          git checkout --detach "$PERF02_CODE_SHA"
      - name: Fresh candidate, full historical regression, observer and stream-contract tests
        run: |
          python3 perf02/evidence.py --start
          python3 tools/fusion02_evidence.py start --marker build/perf02/candidate-marker.json
          bash tools/cloud-env.sh ./gradlew -I perf02/qualification.init.gradle :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :p2-endpoint:testDebugUnitTest :p2-endpoint:assembleDebug :p2-endpoint:lintDebug :p2-client:assembleDebug :p2-client:lint --rerun-tasks --no-daemon --max-workers=2 --console=plain
          python3 tools/fusion02_evidence.py finish --marker build/perf02/candidate-marker.json --output build/perf02/candidate-results.json
          python3 perf02/evidence.py --require-marker
      - name: Unchanged production APK boundaries and exact source preservation
        run: |
          bash tools/cloud-env.sh python3 tools/check-apk.py app/build/outputs/apk/debug/app-debug.apk
          bash tools/cloud-env.sh python3 tools/check-fixtures.py
          python3 perf02/check.py --ci
          python3 tools/review-fusion-02-native.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: perf02-software-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/perf02/
            domain/build/perf02/
            domain/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            fixtures/p2-endpoint/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            fixtures/p2-endpoint/build/reports/lint-results-debug.*
            fixtures/p2-client/build/reports/lint-results-*.xml
            build/native-tests/Testing/Temporary/LastTest.log
            build/fusion-02/native-review.json
            build/mission003f-apks.json
          if-no-files-found: warn
